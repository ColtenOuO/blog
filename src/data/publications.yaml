# 研究頁（/research）
#
# me         自己在論文上的名字（各種寫法），作者列表裡會加粗並加上 *
# interests  研究方向（左欄）
# journals                 期刊論文
# international_conferences 國際會議論文
# domestic_conferences      國內會議論文
# 以上各自由新到舊排；每篇欄位如下：
#
# title    論文標題（必填）
# authors  作者（必填），用「, 」或「、」分隔，例如 "Jyun-An Chen, Xxx Wang" 或 "陳俊安、王小明"
# venue    期刊 / 會議名稱（必填），例如 "IEEE Transactions on ..."、"ICPP 2026"
# year     年份
# note     補充，例如 Best Paper Award、Accepted、Under Review
# links    相關連結 [{ label, href }]，例如 PDF、DOI、Code、Slides
#
# 範例：
# journals:
#   - title: A Paper Title
#     authors: Jyun-An Chen, Coauthor Name
#     venue: IEEE Transactions on Parallel and Distributed Systems
#     year: 2027
#     links:
#       - label: PDF
#         href: https://example.com/paper.pdf
#       - label: DOI
#         href: https://doi.org/xxx

