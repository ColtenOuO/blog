# 專案（照這裡的順序顯示）
#
# name         專案名稱（必填）
# description  說明（必填）
# kind         類型標籤，例如 畢業專題 / 團隊專案 / Side Project
# tech         使用技術
# links        連結 [{ label, href }]；GitHub 可簡寫成 github: ColtenOuO/xxx
# home         true = 顯示在首頁

- name: PHACO
  kind: 畢業專題
  home: true
  description: 以蟻群演算法求解「第 k 小生成樹」。加入類似突變的最佳解擾動機制，並用 AVL tree 維護 k 個候選解，跳脫費洛蒙造成的局部最佳解；再把蟻群迭代平行化到多核心。實驗中正確率與誤差都優於原始蟻群演算法，k 越大差距越明顯。
  tech: [C++, Parallel Computing, Heuristic Optimization, Graph Algorithms]

- name: AlgoPilot
  kind: 團隊專案
  home: true
  description: AI 驅動的 VS Code 擴充套件，邊寫程式邊給出 code review、邊界測資與 crash 分析，支援 7 種語言。後端以 FastAPI + Celery + RabbitMQ 串接 Ollama / OpenAI 做非同步 LLM 靜態分析。獲 2025 AMD AI Agent Online Hackathon 季軍。
  tech: [TypeScript, FastAPI, PostgreSQL, Celery, RabbitMQ, Redis, Docker, LLM]
  github: YouSayIsRighTeam/AlgoPilot

