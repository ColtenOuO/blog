# 開源貢獻（會依 merged 數量自動由多到少排序）
#
# repo        GitHub repo，例如 apache/airflow（必填；非 GitHub 專案就寫名稱）
# merged      合併數量（必填）。GitHub repo 會在 build 時自動向 GitHub 更新，這裡的數字是備援
# reviewed    review 過的 PR 數量（不含自己的 PR）。同樣會自動更新，這裡是備援
# unit        數量單位，預設 merged；非 GitHub 可寫 patch
# href        點擊要去的網址；不填則連到你在該 repo 的 merged PR 列表
# role        角色標籤，例如 Maintainer
# about       這個專案是什麼（一句話介紹）
# note        你做了什麼
# logo        src/assets/logos/ 裡的檔名（不含副檔名）。不填會自動找：
#             <repo 名稱>.png → <組織名稱>.png，例如 apache/airflow 先找 airflow，再找 apache
# links       額外連結 [{ label, href }]
# highlights  代表性 PR [{ title, pr }]

- repo: apache/airflow
  merged: 55
  reviewed: 55
  about: Apache 基金會的工作流程排程平台，用 Python 撰寫、排程與監控資料管線（Dag）
  note: 改進 API 與資料庫查詢效能、協助新 provider 開發與新版本發布；近幾個月全球前 20 名貢獻者
  highlights:
    - title: Fix N+1 query in bulk update for Variables and Pools
      pr: 71918
    - title: Reduce memory used when deleting a Dag with a large history
      pr: 71185
    - title: Complete the Traditional Chinese UI translations
      pr: 71019
    - title: Add SSL cipher list option to the api server
      pr: 71645

