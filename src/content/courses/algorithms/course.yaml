title: 演算法
en: Algorithms
description: 以嚴謹的角度學習演算法設計與分析：分治、動態規劃、貪婪、基礎圖論演算法與正確性證明，理解每個方法為什麼對、為什麼快。如果你是想要在競程或面試中刷題，這門課程可能不適合你 (建議參考演算法解題工程)；如果你想把演算法的理論基礎打好，這門課程就是為你設計的。
tags:
  - 演算法
  - 複雜度分析
  - 正確性證明
prerequisites:
  - 熟悉至少一種程式語言，並了解基本資料結構。
  - 具備離散數學基礎。
audience:
  - 修習演算法課程的大學生：想把課本上的觀念和證明真正弄懂。
  - 準備研究所考試的學生：需要系統性複習演算法設計與分析。
  - 已經會解題、想補上理論基礎的競程選手與工程師。
order: 3
