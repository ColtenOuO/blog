title: 網路流
en: Network Flow
description: 從最大流最小割定理出發，學習 Ford–Fulkerson、Dinic 等演算法，以及二分圖匹配、最小費用流，並練習把看似無關的問題建模成流網路。
tags:
  - 演算法
  - 圖論
  - 網路流
prerequisites:
  - 熟悉圖的表示法與 BFS、DFS 等基本圖論演算法。
  - 能用 C++ 實作中等難度的演算法題目。
audience:
  - 想突破進階題目的競程選手：網路流是冷門但關鍵時刻能派上用場的知識。
  - 修習演算法課程、想深入圖論的大學生。
  - 對組合最佳化與建模有興趣的自學者。
order: 5
